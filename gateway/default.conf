# DEEP CYBER SECURITY TESTING LAB ONLY
# This gateway intentionally contains bounded, documented authorization and
# CORS mistakes. It proxies only to fixed Docker service names; it is not an
# open forward proxy and does not hold AWS credentials.

# TRAINING FLAW GW-01: identity values come from untrusted request headers.
map $http_x_training_user $training_user {
    ""      "anonymous";
    default $http_x_training_user;
}

map $http_x_training_tenant $training_tenant {
    ""      "public";
    default $http_x_training_tenant;
}

map $http_x_training_role $training_role {
    ""      "USER";
    default $http_x_training_role;
}

upstream training_frontend {
    server frontend:80;
    keepalive 16;
}

upstream training_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Training-Lab "deliberately-vulnerable" always;

    location = /_gateway/health {
        default_type application/json;
        return 200 '{"status":"ok","component":"training-gateway"}\n';
    }

    # Runtime GW-02 enforcement is in Spring, using the marker overwritten by
    # this gateway. Fixed mode checks the entire administrative subtree.
    location = /api/admin {
        include /etc/nginx/snippets/training-proxy-headers.conf;
        proxy_pass http://training_backend;
    }

    location /api/ {
        include /etc/nginx/snippets/training-proxy-headers.conf;

        # No URI suffix: preserve the complete /api/... path for Spring.
        proxy_pass http://training_backend;

        # Spring's runtime GW-03 filter owns API CORS and preflight responses.
    }

    # Identity traffic must not inherit the lab's permissive API CORS policy.
    location ~ ^/(auth/|\.well-known/) {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://training_backend;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://training_frontend;
    }
}
