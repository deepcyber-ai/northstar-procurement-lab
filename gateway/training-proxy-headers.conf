# Common proxy headers for the deliberately vulnerable API routes.
#
# TRAINING FLAW GW-01: the X-Authenticated-* values below look authoritative to
# the backend, but each one is derived directly from a client-supplied browser
# header. There is no signature, trusted identity-provider assertion, or
# authenticated proxy-to-service channel binding.
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Authenticated-User $training_user;
proxy_set_header X-Authenticated-Tenant $training_tenant;
proxy_set_header X-Authenticated-Role $training_role;
proxy_set_header X-Gateway-Verified "true";
proxy_set_header X-Original-Method $request_method;
proxy_set_header X-Original-URI $request_uri;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix /api;

proxy_http_version 1.1;
proxy_set_header X-Lab-Gateway "nginx";
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
