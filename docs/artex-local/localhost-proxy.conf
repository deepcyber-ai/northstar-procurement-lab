# Operator-run relay for LOCAL_TESTING_SETUP.md.
# Runs in the selected ARTEX/Strix network namespace, not on a published host port.
# Keep the upstream fixed; never turn this into an arbitrary forward proxy.
worker_processes 1;
pid /tmp/northstar-relay.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    # OAuth codes can appear in URLs: do not record access URLs here.
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        client_max_body_size 1m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # No URI suffix: preserve the original request path and query.
            proxy_pass http://northstar-gateway:8080;
            proxy_redirect off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
